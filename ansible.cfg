[defaults]
inventory = inventario.ini
host_key_checking = False
interpreter_python = auto_silent

[ssh_connection]
# Servidores de laboratorio: no guardar ni comparar claves de host (cambian al reconstruir los contenedores)
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
