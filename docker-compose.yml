services:
  servidor1:
    build: .
    image: ubuntu-ssh-ansible
    container_name: servidor1
    hostname: servidor1
    ports:
      - "2221:22"
    networks:
      red_ansible:
        ipv4_address: 172.28.0.11

  servidor2:
    build: .
