---
- name: Automatizar tareas en los servidores Ubuntu
  hosts: servidores
  become: true
  tasks:
    - name: Actualizar los paquetes de APT
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Crear el usuario itla
      ansible.builtin.user:
        name: itla
        shell: /bin/bash
        create_home: true

    - name: Crear la carpeta app
      ansible.builtin.file:
        path: /home/itla/app
        state: directory
        owner: itla
        group: itla
        mode: "0755"

    - name: Crear el archivo hola.txt en la carpeta app
      ansible.builtin.copy:
        dest: /home/itla/app/hola.txt
        content: "Hola Mundo desde {{ inventory_hostname }} - creado con Ansible\n"
        owner: itla
        group: itla
        mode: "0644"

    - name: Instalar cowsay y htop
      ansible.builtin.apt:
        name:
          - cowsay
          - htop
        state: present
