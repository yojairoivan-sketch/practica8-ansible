# Desde WSL los contenedores se alcanzan por 127.0.0.1 y el puerto publicado.
# IP interna de cada servidor en la red Docker: 172.28.0.11 - 172.28.0.15
[servidores]
servidor1 ansible_host=127.0.0.1 ansible_port=2221
servidor2 ansible_host=127.0.0.1 ansible_port=2222
servidor3 ansible_host=127.0.0.1 ansible_port=2223
servidor4 ansible_host=127.0.0.1 ansible_port=2224
servidor5 ansible_host=127.0.0.1 ansible_port=2225

[servidores:vars]
ansible_user=ansible
ansible_password=ansible
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
